# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA / Loom: configuration cache is not supported yet
org.gradle.configuration-cache=false
# 本机 PATH 里的 java 是 JRE(没有 javac), 所以显式指定一个完整 JDK 25 给 Gradle 守护进程。
# 换机器/换路径时改这里, 或者删掉本行并在构建前 export JAVA_HOME=<你的 JDK 25>。
org.gradle.java.home=/home/DSH/.jdks/temurin-25

# Fabric properties (https://fabricmc.net/develop)
# Minecraft 26.1+ is unobfuscated, so no mappings entry is required/used.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21

# Mod properties
version=1.0.0
group=com.example
archives_base_name=mcctl
